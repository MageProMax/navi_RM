# PCD转Nav2栅格地图参数配置文件
# 从工作区根目录运行；输出独立目录，检查后再部署地图。
pcd_path: "./src/rm_bnrobot_nav/maps/pcd/test.pcd"  # 输入PCD文件路径
save_dir: "./maps_output"                                                            # 输出地图保存目录
resolution: 0.05                                                                      # 栅格分辨率（米/像素，推荐0.05~0.1）
z_min: 0.0                                                                            # 点云Z轴最小值（过滤地面以下噪声，根据机器人高度调整）
z_max: 0.55                                                                            # 点云Z轴最大值（过滤高空噪声，根据障碍物高度调整）
