amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 0.3
    robot_model_type: nav2_amcl::OmniMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.3
    laser_max_range: 10.0
    laser_likelihood_max_dist: 2.0
    max_beams: 120
    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.10
    update_min_a: 0.10
    do_beamskip: false
    z_hit: 0.75
    z_rand: 0.20
    z_max: 0.05
    z_short: 0.0
    sigma_hit: 0.2
    lambda_short: 0.1
    save_pose_rate: 0.5

